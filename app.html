<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1c2321">
  <link rel="icon" href="./assets/favicon.ico" sizes="any">
  <link rel="icon" href="./assets/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <title>EatLog — Sổ tay của tôi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body data-page="app">
  <header class="site-header">
    <div class="header-inner">
      <div class="brand-stack"><a class="logo" href="./app.html">Eat<span>Log</span><i>.</i></a><small>SỔ TAY ĂN CHƠI</small></div>
      <nav class="primary-tabs" aria-label="Điều hướng chính">
        <button class="nav-tab is-active" data-tab="mine" type="button">List của tôi</button>
        <button class="nav-tab" data-tab="discover" type="button">Khám phá</button>
      </nav>
      <div class="header-actions">
        <div class="account-area">
          <button
            id="account-button"
            class="account-button"
            type="button"
            aria-label="Mở menu tài khoản"
            aria-controls="account-menu"
            aria-expanded="false"
          >
            <span id="header-avatar" class="avatar avatar-small">?</span>
          </button>

          <div id="account-menu" class="account-menu paper" inert>
            <strong id="account-name">Người dùng</strong>

            <div class="account-menu-divider"></div>

            <button id="sound-toggle" class="account-menu-action" type="button">
              <svg viewBox="0 0 24 24" width="18" height="18"
                  fill="none" stroke="currentColor" stroke-width="1.8"
                  stroke-linecap="round" stroke-linejoin="round"
                  aria-hidden="true">
                <path d="M11 5 6 9H3v6h3l5 4V5Z"/>
                <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
                <path d="M19 5a10 10 0 0 1 0 14"/>
              </svg>
              <span>Âm thanh tap</span>
              <span id="sound-state" class="account-action-state">Bật</span>
            </button>

            <button id="logout-button"
                    class="account-menu-action logout-action"
                    type="button">
              <svg viewBox="0 0 24 24" width="18" height="18"
                  fill="none" stroke="currentColor" stroke-width="1.8"
                  stroke-linecap="round" stroke-linejoin="round"
                  aria-hidden="true">
                <path d="M10 17l5-5-5-5"/>
                <path d="M15 12H3"/>
                <path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"/>
              </svg>
              <span>Đăng xuất</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="app-main">
    <section id="mine-view" class="view">
      <div class="section-heading"><div><p class="eyebrow">NHỮNG CHỖ MUỐN NHỚ</p><h1>List của tôi<span class="gold-period">.</span></h1><p>Tìm chỗ ăn chơi nè</p></div></div>
      <div id="mine-category-tabs" class="category-tabs" aria-label="Chọn danh mục của tôi"></div>
      <div id="mine-status-tabs" class="status-tabs" role="group" aria-label="Trạng thái quán"></div>
      <div id="mine-filters" class="filters paper"></div>
      <div id="mine-cards" class="cards-grid" aria-live="polite"><div class="loading-state"><span class="spinner"></span>Đang mở sổ tay…</div></div>
    </section>

    <section id="discover-view" class="view" hidden>
      <div class="section-heading"><div><p class="eyebrow">GỢI Ý TỪ NHỮNG CUỐN SỔ KHÁC</p><h1>Khám phá<span class="gold-period">.</span></h1><p>Khám phá những địa điểm mọi người đã lưu.</p></div></div>
      <div id="discover-users-panel"><div id="discover-users" class="users-grid"><div class="loading-state"><span class="spinner"></span>Đang tìm các sổ tay…</div></div></div>
      <div id="discover-list-panel" hidden>
        <button id="discover-back" class="btn btn-back" type="button">← Danh sách người dùng</button>
        <div id="discover-owner" class="discover-owner paper"></div>
        <div id="discover-category-tabs" class="category-tabs" aria-label="Chọn danh mục khám phá"></div>
        <div id="discover-status-tabs" class="status-tabs" role="group" aria-label="Trạng thái quán của người dùng"></div>
        <div id="discover-filters" class="filters paper"></div>
        <div id="discover-cards" class="cards-grid" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <button id="add-button" class="floating-add" type="button" aria-label="Thêm quán mới" title="Thêm quán">+</button>

  <dialog id="entry-modal" class="entry-dialog paper" aria-labelledby="modal-title">
    <div class="modal-heading"><div><p id="modal-eyebrow" class="eyebrow">GHI THÊM MỘT CHỖ</p><h2 id="modal-title">Thêm quán mới</h2></div><button id="modal-close" class="icon-btn close-btn" type="button" aria-label="Đóng">×</button></div>
    <form id="entry-form">
      <div class="form-field" id="form-category-field">
        <label>Danh mục</label>
        <div id="form-category" class="category-picker" role="group" aria-label="Danh mục địa điểm"></div>
      </div>
      <div id="restaurant-fields">
        <div class="form-field"><label for="restaurant-name"><span id="place-name-label">Tên quán</span> <span class="required">*</span></label><input id="restaurant-name" maxlength="120" required placeholder="Ví dụ: Bún bò cô Ba"></div>
        <div class="form-grid">
          <div class="form-field"><label for="restaurant-district">Quận / huyện / thành phố <span class="required">*</span></label><input id="restaurant-district" list="hcm-districts" maxlength="80" required placeholder="Ví dụ: Quận 3"><datalist id="hcm-districts">
            <option value="Quận 1"><option value="Quận 3"><option value="Quận 4"><option value="Quận 5"><option value="Quận 6"><option value="Quận 7"><option value="Quận 8"><option value="Quận 10"><option value="Quận 11"><option value="Quận 12"><option value="Bình Thạnh"><option value="Gò Vấp"><option value="Phú Nhuận"><option value="Tân Bình"><option value="Tân Phú"><option value="Bình Tân"><option value="TP. Thủ Đức"><option value="Hóc Môn"><option value="Củ Chi"><option value="Bình Chánh"><option value="Nhà Bè"><option value="Cần Giờ"><option value="Đặc khu Côn Đảo">
          </datalist></div>
          <div class="form-field"><label for="restaurant-address">Địa chỉ (tuỳ chọn)</label><input id="restaurant-address" maxlength="240" placeholder="Số nhà, tên đường…"></div>
        </div>
      </div>
      <div id="restaurant-static" class="restaurant-static" hidden></div>
      <div id="food-only-fields">
      <div class="form-field"><label>Trạng thái</label><div id="form-status" class="choice-row" role="group" aria-label="Trạng thái"><button type="button" data-status="want_to_try" class="choice is-active">Chưa thử</button><button type="button" data-status="eaten" class="choice">Đã ăn</button></div></div>
      <div id="rating-field" class="form-field" hidden><label>Đánh giá</label><div id="form-rating" class="choice-row" role="group" aria-label="Đánh giá"><button type="button" data-rating="good" class="choice">Ngon</button><button type="button" data-rating="ok" class="choice">Ổn</button><button type="button" data-rating="bad" class="choice choice-bad">Đã ăn mà dở</button></div></div>
      <div class="form-field"><label>Mức chi <span class="label-hint">(chọn tối đa 1)</span></label><div id="form-price-tags" class="chip-row"></div></div>
      <div class="form-field"><label>Kiểu ăn <span class="label-hint">(chọn nhiều)</span></label><div id="form-style-tags" class="chip-row"></div></div>
      <div class="form-field"><label for="dish-input">Các món đã lưu</label><div class="inline-input"><input id="dish-input" maxlength="80" placeholder="Nhập một món ăn…"><button id="add-dish" class="btn btn-soft" type="button">Thêm món</button></div><div id="dish-list" class="dish-chips"></div></div>
      </div>
      <div class="form-field"><label for="restaurant-note">Ghi chú / cảm nhận</label><textarea id="restaurant-note" rows="4" maxlength="2000" placeholder="Điều gì khiến bạn nhớ quán này?"></textarea></div>
      <p id="modal-error" class="field-error" role="alert" hidden></p>
      <div class="modal-actions"><button id="delete-entry" class="btn btn-danger-ghost" type="button" hidden>Xoá khỏi list</button><button id="save-entry" class="btn btn-primary" type="submit">Lưu quán</button></div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
